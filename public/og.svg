<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff8e1" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 天空渐变背景 -->
  <rect width="1200" height="630" fill="url(#sky)"/>

  <!-- 太阳光晕 -->
  <circle cx="880" cy="320" r="220" fill="url(#glow)"/>

  <!-- 太阳 -->
  <circle cx="880" cy="320" r="72" fill="#fff8e1"/>

  <!-- 地平线 -->
  <rect y="520" width="1200" height="110" fill="#0b1220"/>

  <!-- 品牌名 -->
  <text x="90" y="300" font-family="Arial, sans-serif" font-size="72" font-weight="700" fill="#ffffff">SolarTrack</text>
  <text x="92" y="368" font-family="Arial, sans-serif" font-size="30" fill="#fde68a">Track the Sun, Live in Light</text>

  <!-- 标签 -->
  <rect x="92" y="420" rx="18" width="300" height="52" fill="#ffffff" opacity="0.15"/>
  <text x="242" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#ffffff">iOS · Free</text>
</svg>
